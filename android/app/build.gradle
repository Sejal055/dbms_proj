plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// 🎯 FIX: Project-level property is now placed here
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


android {
    namespace "com.example.dbms_pro"
    compileSdk 36

    compileOptions {
        // 🎯 FIX: These are required, even with jvmToolchain
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // 🎯 FIX: Use the kotlinOptions block to set JVM target
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.dbms_pro"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger() // Use values from local.properties
        versionName flutterVersionName            // Use values from local.properties
        multiDexEnabled true
    }

    // --- FIX APPLIED HERE ---
    signingConfigs {
        debug {
            // **REMOVED storeFile and storePassword**
            // **Gradle will now use the system-wide debug keystore (~/.android/debug.keystore)**
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    // ------------------------

    buildTypes {
        release {
            signingConfig signingConfigs.debug // Should ideally use a separate release signing config
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // This is often automatically added by Flutter
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24" 
    
    // Core Desugaring implementation
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}